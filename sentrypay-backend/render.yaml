services:
  - type: web
    name: sentrypay-api
    env: python
    region: oregon
    plan: free
    branch: master
    buildCommand: |
      pip install -r requirements.txt
      python data/generate_synthetic.py
      cd model && python train.py && python train_mule_model.py
    startCommand: cd api && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
